[package]
name = "toolbelt"
version = "0.1.0"
description = "Toolbelt – developer utilities"
authors = ["akinozgen"]
edition = "2021"

[lib]
name = "toolbelt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri            = { version = "2", features = ["tray-icon"] }
tauri-plugin-fs  = "2.4"
tauri-plugin-os  = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2.7"
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"

# Hashing
md-5             = "0.10"
sha1             = "0.10"
sha2             = "0.10"
digest           = "0.10"
hex              = "0.4"

# Encoding
base64           = "0.22"
urlencoding      = "2"

# Formatting
serde_yml        = "0.0.12"
quick-xml        = { version = "0.36", features = ["serialize"] }

# Diff
similar          = { version = "2", features = ["text"] }

# Markdown
pulldown-cmark   = { version = "0.12", default-features = false, features = ["html"] }

# HTTP
reqwest          = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "brotli", "multipart"] }
tokio            = { version = "1", features = ["fs", "io-util", "rt-multi-thread", "macros", "sync"] }
once_cell        = "1"

# Generate
uuid             = { version = "1", features = ["v4", "v7"] }
ulid             = "1"
nanoid           = "0.4"
cuid2            = "0.1"
rand             = "0.8"
lipsum           = "0.9"
qrcode           = { version = "0.14", default-features = false, features = ["svg"] }
rqrr             = "0.7"
image            = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
rsa              = { version = "0.9", features = ["pem"] }
time             = { version = "0.3", default-features = false, features = ["formatting", "parsing", "macros", "serde-human-readable", "local-offset"] }

# Crypto
bcrypt           = "0.15"
argon2           = "0.5"
pbkdf2           = "0.12"
hmac             = "0.12"
aes-gcm          = "0.10"
totp-rs          = "5"
zxcvbn           = "3"

# Text
slug             = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.5"

[profile.release]
panic   = "abort"
codegen-units = 1
lto     = true
opt-level = "s"
strip   = true
